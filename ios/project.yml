name: ChristSupplyMatrix
options:
  bundleIdPrefix: net.christsupply
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChristSupplyMatrix:
    type: application
    platform: iOS
    sources:
      - path: ChristSupplyMatrix
        excludes:
          - Resources/web-chapters.json
      - path: ChristSupplyMatrix/Resources/web-chapters.json
        buildPhase: resources
        type: file
      - path: ../data/books.json
        buildPhase: resources
        type: file
      - path: ../data/indexes.json
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.christsupply.holybible
        INFOPLIST_FILE: ChristSupplyMatrix/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "$(TARGET_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_CFBundleDisplayName: "Christ Supply"
    info:
      path: ChristSupplyMatrix/Info.plist
